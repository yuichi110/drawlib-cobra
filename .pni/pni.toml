# PNI Project Configuration Manifest (.pni/pni.toml)
# Precedence: CLI / Workflow step `with:` > Workflow YAML > .pni/pni.toml > Built-in defaults

[project]
name = "cobra"
archetypes = ["library"]

[targets]
root = "."
source = [".", "doc"]
tests = [".", "doc"]
docs = ["README.md"]
exclude = [
    "user_guide_src/**",
    "api_src/**",
    "architecture_src/**",
    "pni501_src/**",
    "docs/**",
]

[scan]
respect_gitignore = true
include_gitignored = ["go.sum"]
skip_files = [".env", ".env.*", "**/.env"]
skip_dirs = ["user_guide_src", "api_src", "architecture_src", "pni501_src", "docs"]

[report]
src_dir = "."
output_dir = "docs/pni501"
html_output_dir = "docs/pni501"
formats = ["pdf", "html"]
lang = "en"
style = "google"

# Declarative design waivers for framework-specific and harness patterns:
[[opt_out]]
id = "DS-0026"
scope = [".pni/dockerfiles/**"]
reason = "Hermetic batch test container exits upon go test completion; daemon HEALTHCHECK is not applicable."
